  .modulex-ekip-oyuncu-karti-govde::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(115deg, transparent 35%, color-mix(in srgb, --text-- 16%, transparent) 50%, transparent 65%); translate: -120% 0; transition: translate 0.9s ease; pointer-events: none; }

  .modulex-ekip-oyuncu-karti-kod { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; }

  .modulex-ekip-oyuncu-karti-stat { display: grid; gap: 4px; }
  .modulex-ekip-oyuncu-karti-stat dt { color: --muted--; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
  .modulex-ekip-oyuncu-karti-stat dd { display: grid; grid-template-columns: 2.2em minmax(0, 1fr); align-items: center; gap: 8px; }
  .modulex-ekip-oyuncu-karti-sdeger { font-size: 1.05rem; font-weight: 800; font-variant-numeric: tabular-nums; }

  .modulex-ekip-oyuncu-karti-cizik::before { content: ""; display: block; inline-size: calc(var(--v) * 1%); block-size: 100%; border-radius: inherit; background-color: --accent--; transform-origin: 0 50%; transition: transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1); transition-delay: calc(var(--i, 0) * 90ms + 200ms); }
  [dir="rtl"] .modulex-ekip-oyuncu-karti-cizik::before { transform-origin: 100% 50%; }
  .modulex-ekip-oyuncu-karti--hazir:not(.modulex-ekip-oyuncu-karti--gor) .modulex-ekip-oyuncu-karti-cizik::before { transform: scaleX(0); }

    .modulex-ekip-oyuncu-karti-puan { margin: 8px; padding: 6px 7px; }
    .modulex-ekip-oyuncu-karti-pdeger { font-size: 1.5rem; }
    .modulex-ekip-oyuncu-karti-levha { margin-block-start: -24px; padding: 8px 8px 10px; }
    .modulex-ekip-oyuncu-karti-levha .modulex-ekip-oyuncu-karti-ad { font-size: 0.92rem; letter-spacing: 0.02em; }
    .modulex-ekip-oyuncu-karti-statlar { grid-template-columns: minmax(0, 1fr); gap: 6px; margin-inline: 10px; padding-block: 10px 18px; }
    .modulex-ekip-oyuncu-karti-stat dd { grid-template-columns: 2em minmax(0, 1fr); gap: 6px; }

  :where(.modulex-ekip-oyuncu-karti) img { height: auto; }

  .modulex-ekip-oyuncu-karti-bag { color: inherit; text-decoration: none; }

  .modulex-ekip-oyuncu-karti-harf { display: grid; place-items: center; background-color: --vurguBg--; color: --vurguText--; font-weight: 800; letter-spacing: 0.02em; }

  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-oyuncu-karti :is(.modulex-ekip-oyuncu-karti-baslik, .modulex-ekip-oyuncu-karti-ust, h3, h4, strong) { letter-spacing: 0; }
  :is([lang="ar"], [lang="fa"], [lang="he"], [lang="ur"]) .modulex-ekip-oyuncu-karti-baslik { line-height: 1.35; }
  @media (max-width: 768px) {
    .modulex-ekip-oyuncu-karti { padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .modulex-ekip-oyuncu-karti *, .modulex-ekip-oyuncu-karti *::before, .modulex-ekip-oyuncu-karti *::after { animation: none !important; transition: none !important; }
  }
</style>
<script>
  (() => {
    const P = "modulex-ekip-oyuncu-karti";
    const az = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
    const gozlem = (s, P, az) => {
        const gor = () => s.classList.add(P + "--gor");
        s.classList.add(P + "--hazir");
        if (az || !("IntersectionObserver" in window)) { gor(); return; }
        const io = new IntersectionObserver((gs) => {
          gs.forEach((g) => { if (g.isIntersecting) { gor(); io.disconnect(); } });
        }, { threshold: 0.15 });
        io.observe(s);
      };
    document.querySelectorAll("." + P).forEach((s) => {
      if (s.dataset.fbHazir) return;
      s.dataset.fbHazir = "1";
      gozlem(s, P, az);
    });
  })();
</script>
